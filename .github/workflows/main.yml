name: Build SukiSU Ultra for OnePlus 12

on:
  workflow_dispatch:
    inputs:
      HOOK:
        type: choice
        description: "钩子选择"
        required: true
        default: manual
        options:
          - kprobe
          - manual
          - tracepoint
      SUSFS_CI:
        type: choice
        description: "下载SUSFS模块调用方式"
        required: true
        default: Release
        options:
          - CI
          - Release
          - NoN
      KSU_META:
        type: string
        description: "分支名/版本标识"
        required: false
        default: "susfs-main/Jasmine/"
      BUILD_TIME:
        type: string
        description: "自定义构建时间 (输入F使用当前时间)"
        required: false
        default: "F"
      SUFFIX:
        type: string
        description: "自定义内核后缀"
        required: false
        default: ""
      FAST_BUILD:
        type: boolean
        description: "是否启用极速构建？"
        required: true
        default: true
      LSM:
        type: boolean
        description: "是否启用内核层面安全保护？"
        required: true
        default: false
      SCHED:
        type: boolean
        description: "是否添加风驰驱动？"
        required: true
        default: false
      ZRAM:
        type: boolean
        description: "是否添加更多ZRAM算法？"
        required: true
        default: false

jobs:
  build:
    name: Build SukiSU Ultra
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
      KERNEL_DIR: "${{ github.workspace }}/kernel"
      DEVICE_CODENAME: "oneplus12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Create and Enable 4G Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set Cache Environment
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.DEVICE_CODENAME }}" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ env.DEVICE_CODENAME }}"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git ccache automake flex lzop bison gperf build-essential \
            zip curl zlib1g-dev g++-multilib bzip2 libbz2-dev liblz4-tool \
            make squashfs-tools dpkg-dev libssl-dev python3 bc libc6-dev-i386 \
            libncurses5-dev libelf-dev unzip

      - name: Restore Ccache
        uses: actions/cache@v3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.DEVICE_CODENAME }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.DEVICE_CODENAME }}-

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/Jaslovecam/android_kernel_oneplus_sm8650.git -b varuna ${{ env.KERNEL_DIR }} --depth=1
          # 清理 dirty 标记
          sed -i 's/ -dirty//g' ${{ env.KERNEL_DIR }}/scripts/setlocalversion

      - name: Kernel Version Handling
        run: |
          cd ${{ env.KERNEL_DIR }}
          # 获取内核版本信息
          echo "KERNEL_VERSION=$(make kernelversion)" >> $GITHUB_ENV
          echo "KERNEL_NAME=$(make kernelversion | cut -d. -f1-2)" >> $GITHUB_ENV
          echo "KANDROID_VERSION=$(grep -oP 'VERSION = \K\d+' Makefile).$(grep -oP 'PATCHLEVEL = \K\d+' Makefile)" >> $GITHUB_ENV

      - name: Custom Kernel Suffix
        id: suffix
        run: |
          cd ${{ env.KERNEL_DIR }}
          if [ -z "${{ github.event.inputs.SUFFIX }}" ]; then
            SUFFIX=$(openssl rand -hex 4)
          else
            SUFFIX="${{ github.event.inputs.SUFFIX }}"
          fi
          echo "value=-$SUFFIX" >> $GITHUB_OUTPUT
          echo "TKERNEL_VERSION=${{ env.KERNEL_VERSION }}-$SUFFIX" >> $GITHUB_ENV

      - name: Add SukiSU Ultra
        run: |
          cd ${{ env.KERNEL_DIR }}
          # 克隆 SukiSU
          git clone https://github.com/tiann/KernelSU.git
          cd KernelSU
          # 根据内核版本选择合适的分支
          if [ "${{ env.KERNEL_NAME }}" = "5.10" ]; then
            git checkout ksu-11572
          elif [ "${{ env.KERNEL_NAME }}" = "5.15" ]; then
            git checkout ksu-11572
          else
            git checkout main
          fi
          
          cd ..
          # 复制 SukiSU 到内核
          cp -r KernelSU/kernel KernelSU/

      - name: Apply Patches SukiSU Ultra
        run: |
          cd ${{ env.KERNEL_DIR }}
          # 克隆补丁仓库
          git clone https://gitlab.com/simonpunk/susfs4ksu.git
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          
          echo "正在应用 SukiSU 补丁"
          # 应用主要补丁
          for patch in SukiSU_patch/patches/*.patch; do
            echo "应用补丁: $patch"
            patch -p1 --no-backup-if-mismatch < "$patch" || true
          done
          
          # 应用 SUSFS 补丁
          if [ -d "susfs4ksu/kernel_patches" ]; then
            cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-*.patch ./
            patch -p1 --no-backup-if-mismatch < 50_add_susfs_in_gki-*.patch || true
          fi

      - name: Configure Build Environment
        run: |
          cd ${{ env.KERNEL_DIR }}
          # 设置构建配置
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 创建默认配置
          make vendor/oneplus/varuna_defconfig

      - name: Build Kernel FAST
        if: github.event.inputs.FAST_BUILD == 'true'
        run: |
          cd ${{ env.KERNEL_DIR }}
          export PATH="/usr/lib/ccache:$PATH"
          
          # 快速构建
          make -j$(nproc --all) CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Build Kernel Normal
        if: github.event.inputs.FAST_BUILD != 'true'
        run: |
          cd ${{ env.KERNEL_DIR }}
          export PATH="/usr/lib/ccache:$PATH"
          
          # 完整构建
          make -j$(($(nproc --all)/2)) CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Make AnyKernel3
        run: |
          # 创建 AnyKernel3 目录
          mkdir -p AnyKernel3
          cd AnyKernel3
          
          # 下载 AnyKernel3 模板
          wget https://github.com/osm0sis/AnyKernel3/archive/master.zip
          unzip master.zip
          mv AnyKernel3-master/* .
          rm -rf AnyKernel3-master master.zip
          
          # 复制内核镜像
          cp ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz kernel.gz
          cp ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dtbo.img dtbo.img
          cp ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dtb.img dtb.img
          
          # 创建安装脚本
          cat > anykernel.sh << 'EOF'
          # AnyKernel3 安装脚本
          device.name1=oneplus12
          device.name2=varuna
          block=/dev/block/bootdevice/by-name/boot
          is_slot_device=0
          ramdisk_compression=auto
          
          dump_boot() {
            dd if=$block of=/tmp/anykernel/boot.img
          }
          
          write_boot() {
            dd if=/tmp/anykernel/new-boot.img of=$block
          }
          
          . /tmp/anykernel/tools/ak3-core.sh
          EOF

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-OnePlus12-${{ env.TKERNEL_VERSION }}
          path: ./AnyKernel3/*
