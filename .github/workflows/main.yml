name: Build Sunos OnePlus_Kernel
on:
  workflow_dispatch:
    inputs:
      CPU:
        description: "分支"
        required: true
        default: 'kplatform'
      FEIL:
        description: "配置文件"
        required: true
        default: 'default'
      CPUD:
        description: "处理器代号"
        required: true
        default: 'pineapple'
      ANDROID_VERSION:
        description: "内核安卓版本"
        required: true
        default: 'android14'
      KERNEL_VERSION:
        description: "内核版本"
        required: true
        default: '6.1'
      KERNEL_NAME:
        description: "修改内核名称"
        required: true
        default: '-android14-11-o-g1132d864665d'
      kernelsu_variant:
        description: "选择 KSU"
        required: true
        type: choice
        options:
          - Kernel
          - KSU_Next
        default: KSU_Next
      kernelsu_version:
        description: "选择 KSU 版本"
        required: true
        type: choice
        options:
          - without ksu
          - tag
          - main
        default: main
      SUSFS_ENABLED:
        description: "添加 SUSFS"
        required: true
        type: boolean
        default: true
      VFS_patch_ENABLED:
        description: "添加vfs补丁（新钩子）？"
        required: true
        type: choice
        options:
          - enable
          - disable
        default: enable

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "ychenxuan"
          git config --global user.email "3494167979@qq.com"

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y python3 git curl lld llvm libelf-dev dwarves patch

      - name: Install repo tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize repo and sync
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          git clone https://github.com/Jaslovecam/android_kernel_oneplus_sm8650.git kernel_platform
          cd kernel_platform
          rm -rf android/abi_gki_protected_exports_* || true
          sed -i 's/ -dirty//g' scripts/setlocalversion || true

      - name: "⚡ Setup KernelSU Next | 配置 KernelSU Next"
        run: |
          cd kernel_workspace/kernel_platform
          echo "🛠️ 正在设置KernelSU Next..."
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs
          cd KernelSU-Next
          KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/commits?sha=next&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 10200)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=11998/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile
          echo "✅ KernelSU Next 配置完成"

      - name: Apply SUSFS Patches MKSU-SKN
        if: ${{ (github.event.inputs.kernelsu_variant == 'KSU_Next') && github.event.inputs.SUSFS_ENABLED == 'true' }}
        run: |
          cd kernel_workspace
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }} || true
          git clone https://github.com/cabagekiller/kernel_patches.git || true
          cd kernel_platform

          # Copy SUSFS patches if they exist
          if [ -f "../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch" ]; then
            cp "../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch" ./
            cp -r "../susfs4ksu/kernel_patches/fs/"* "./fs/" || true
            cp -r "../susfs4ksu/kernel_patches/include/linux/"* "./include/linux/" || true

            echo "正在给内核打susfs补丁"
            patch -p1 < "50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch" || true
            echo "完成"
          else
            echo "SUSFS patches not found, skipping..."
          fi

      - name: Apply Hide Stuff Patches
        if: ${{ github.event.inputs.SUSFS_ENABLED == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform
          if [ -f "../kernel_patches/69_hide_stuff.patch" ]; then
            cp "../kernel_patches/69_hide_stuff.patch" ./
            echo "正在打隐藏应用补丁"
            patch -p1 -F 3 < 69_hide_stuff.patch || true
          else
            echo "Hide stuff patch not found, skipping..."
          fi

      - name: Apply New Hooks Patches
        if: ${{ github.event.inputs.VFS_patch_ENABLED == 'enable' }}
        run: |
          cd kernel_workspace/kernel_platform
          if [ -f "../kernel_patches/next/syscall64_hooks.patch" ]; then
            cp "../kernel_patches/next/syscall64_hooks.patch" ./
            echo "正在打vfs补丁"
            patch -p1 -F 3 < syscall64_hooks.patch || true
            echo "完成"
          else
            echo "VFS patch not found, skipping..."
          fi

      - name: Add SUSFS Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform
          # Add KSU configuration settings
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_WITH_KPROBES=n" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_COMPAT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_VFS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_XATTR=y" >> ./arch/arm64/configs/gki_defconfig

          # Remove defconfig check
          sed -i '2s/check_defconfig//' ./build.config.gki || true

      - name: Add make name
        run: |
          cd kernel_workspace/kernel_platform
          echo "Running sed commands..."

          # Run sed commands for modifications
          sed -i 's/check_defconfig//' ./build.config.gki || true
          sed -i '$s|echo "\$res"|echo "\$res-Cabage"|' ./scripts/setlocalversion || true
          sed -i 's/-dirty//' ./scripts/setlocalversion || true
      - name: Build kernel
        if: ${{ github.event.inputs.CPU != 'sm8650' }}
        run: |
          cd kernel_workspace/kernel_platform
          
          # 简化配置步骤，只使用必要的配置
          echo "使用简化配置..."
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc --all) O=out gki_defconfig
          
          # 如果有 vendor 配置，逐个应用
          if [ -f "vendor/pineapple_GKI.config" ]; then
            echo "应用 vendor 配置..."
            make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc --all) O=out vendor/pineapple_GKI.config
          fi
          
          # 最终确认配置
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc --all) O=out olddefconfig
          
          # 构建内核
          echo "开始内核构建..."
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc --all) O=out
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc --all) O=out modules_install INSTALL_MOD_PATH=./Kernel_Prebuilts
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc --all) O=out install INSTALL_PATH=./Kernel_Prebuilts
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc --all) O=out headers_install INSTALL_HDR_PATH=./Kernel_Prebuilts/usr

      - name: Set Timestamp and Variables
        id: timestamp
        run: |
          echo "CURRENT_TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV
          echo "ROOT_DIR_PREFIX=${{ github.event.inputs.CPU }}-${{ github.event.inputs.CPUD }}" >> $GITHUB_ENV
          echo "CONFIG_NAME=${{ github.event.inputs.FEIL }}" >> $GITHUB_ENV

      - name: Prepare and Package AnyKernel3 (Image Only)
        run: |
          cd $GITHUB_WORKSPACE
          
          # --- Clone AnyKernel3 ---
          echo "Cloning AnyKernel3..."
          git clone https://github.com/cabagekiller/AnyKernel3.git -b gki-2.0 --depth=1 AnyKernel3
          rm -rf AnyKernel3/.git

          # --- Copy Kernel Image ---
          echo "Copying kernel Image..."
          if [ -f "kernel_workspace/kernel_platform/out/arch/arm64/boot/Image" ]; then
            cp kernel_workspace/kernel_platform/out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "Error: Kernel Image not found!"
            exit 1
          fi

          # --- Set up Zip Name ---
          ZIP_FILENAME="AnyKernel3-ImageOnly_${KSUVER}_${CONFIG_NAME}_pineapple_${CURRENT_TIMESTAMP}.zip"
          echo "ZIP_FILENAME=${ZIP_FILENAME}" >> $GITHUB_ENV

          # --- Create the Zip File ---
          echo "Creating zip file: ${ZIP_FILENAME}..."
          cd AnyKernel3
          zip -r9 "../${ZIP_FILENAME}" * -x ".git*" "LICENSE" "README.md" "*.zip" modules
          cd ..

          # --- Verify Zip Contents ---
          echo "Listing contents of ${ZIP_FILENAME}..."
          unzip -l "${ZIP_FILENAME}"

        env:
          KSUVER: ${{ env.KSUVER }}
          CURRENT_TIMESTAMP: ${{ env.CURRENT_TIMESTAMP }}
          CONFIG_NAME: ${{ env.CONFIG_NAME }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.ZIP_FILENAME }}
          tag_name: release-${{ env.CURRENT_TIMESTAMP }}
          name: Release ${{ env.ROOT_DIR_PREFIX }} ${{ env.ZIP_FILENAME }}
          body: |
            Release for ${{ env.ROOT_DIR_PREFIX }} based on branch ${{ github.event.inputs.CPU }}.
            KSU Version: ${{ env.KSUVER }}
            Timestamp: ${{ env.CURRENT_TIMESTAMP }}
            Config: ${{ github.event.inputs.FEIL }}
            Device: ${{ github.event.inputs.CPUD }}
            KernelSU Variant: ${{ github.event.inputs.kernelsu_variant }}
            SUSFS Enabled: ${{ github.event.inputs.SUSFS_ENABLED }}
          draft: false
          prerelease: false
        if: success()
